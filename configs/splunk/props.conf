# Splunk props.conf — field extractions and sourcetype configuration

[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
MAX_EVENTS = 100000
KV_MODE = xml
pulldown_type = true

[WinEventLog:Security]
SHOULD_LINEMERGE = false
REPORT-auth = windows_security_auth
